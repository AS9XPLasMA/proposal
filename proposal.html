<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>no neet to be so shy 🤭</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffeef2;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .hidden {
            display: none;
        }

        h1 {
            color: #d11a2a;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .gif-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            overflow: hidden;
            border-radius: 15px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            min-height: 60px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .yes-btn {
            background-color: #ff3366;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
        }

        .yes-btn:hover {
            transform: scale(1.05);
            background-color: #e60039;
        }

        .no-btn {
            background-color: #888888;
            color: white;
            position: relative;
        }

        #success-container h1 {
            font-size: 2.5rem;
            color: #ff3366;
        }

        .celebration-text {
            color: #555;
            font-size: 1.2rem;
            margin-top: 10px;
            line-height: 1.5;
        }

        #play-again-btn {
            background-color: #33cc66;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="proposal-container" class="container">
        <div class="gif-container">
            <img src="https://media1.tenor.com/m/YUzSi77KQJcAAAAC/yell-shy.gif" alt="Asking Love">
            <img src="" alt="Asking Love">
        </div>
        <h1>Do you love me?</h1>
        <div class="buttons">
            <button class="yes-btn" onclick="showSuccess()">Yes! ❤️</button>
            <button class="no-btn" onclick="nextNoStep()">No 😢</button>
        </div>
    </div>

    <div id="think-container" class="container hidden">
        <div class="gif-container">
            <img src="https://media.tenor.com/MpaHeJeZybgAAAAi/cat-hug.gif" alt="Crying Cat">
        </div>
        <h1>Please think again! 🥺</h1>
        <div class="buttons">
            <button class="yes-btn" onclick="showSuccess()">Yes! ❤️</button>
            <button class="no-btn" onclick="nextNoStep()">Still No 😭</button>
        </div>
    </div>

    <div id="soch-lo-container" class="container hidden">
        <div class="gif-container">
            <img src="https://media1.tenor.com/m/Fh3OmH0RtfwAAAAd/boldo.gif" alt="Crying blob">
        </div>
        <h1>Ek aur baar soch lo! 😭</h1>
        <div class="buttons">
            <button class="yes-btn" onclick="showSuccess()">Yes! ❤️</button>
            <button class="no-btn" onclick="nextNoStep()">No way 😡</button>
        </div>
    </div>

    <div id="agree-container" class="container hidden">
        <div class="gif-container">
            <img src="https://media1.tenor.com/m/mhzppZy8BDUAAAAC/shiki-ichinose-tougen-anki.gif" alt="Maan jao">
        </div>
        <h1>Baby, please agree now! Kitna bhav khaogi</h1>
        <div class="buttons">
            <button class="yes-btn" onclick="showSuccess()">Yes! ❤️</button>
            <button class="no-btn" onclick="nextNoStep()">No</button>
        </div>
    </div>

    <div id="final-no-container" class="container hidden">
        <div class="gif-container">
            <img src="https://media1.tenor.com/m/4SkhbgzxMqsAAAAC/anime-girl.gif" alt="Final crying">
        </div>
        <h1>You can't say no! 😉</h1>
        <div class="buttons">
            <button class="yes-btn" onclick="showSuccess()">Yes! ❤️</button>
            <button id="no-btn-final" class="no-btn" onmouseover="moveButton(this)" ontouchstart="moveButton(this)">No nahi bol sakte! 😂</button>
        </div>
    </div>

    <div id="success-container" class="container hidden">
        <h1>Yaaay! I Knew It! 🎉</h1>
        <p class="celebration-text">You just made me the happiest person in the universe! I promise to love you endlessly. ❤️</p>
        <button id="play-again-btn" onclick="location.reload()">Play Again</button>
    </div>

    <script>
        let step = 1;
        const containers = [
            'proposal-container',
            'think-container',
            'soch-lo-container',
            'agree-container',
            'final-no-container',
            'success-container'
        ];

        function nextNoStep() {
            if (step < 5) {
                document.getElementById(containers[step - 1]).classList.add('hidden');
                document.getElementById(containers[step]).classList.remove('hidden');
                step++;
            }
        }

        function showSuccess() {
            containers.forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('success-container').classList.remove('hidden');
        }

        function moveButton(btn) {
            btn.style.position = 'fixed';
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) + 20;
            btn.style.left = `${x}px`;
            btn.style.top = `${y}px`;
        }
    </script>
</body>
</html>
